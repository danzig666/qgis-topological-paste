<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- clipboard -->
  <rect x="8" y="9" width="40" height="50" rx="4" fill="#f4e3b5" stroke="#6b5a2e" stroke-width="3"/>
  <rect x="19" y="4" width="18" height="10" rx="3" fill="#9aa3ab" stroke="#4c555c" stroke-width="2.5"/>
  <!-- existing polygon, trimmed: keeps only the part not covered by the pasted one -->
  <path d="M14 24 H30 V36 H22 V50 H14 Z" fill="#8fb4d9" stroke="#1f4e79" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- pasted polygon on top, sharing the boundary -->
  <path d="M30 36 H58 V58 H22 V36 Z" fill="#f28e2b" stroke="#8a3d00" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- shared-boundary nodes -->
  <circle cx="30" cy="36" r="3.2" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <circle cx="22" cy="36" r="3.2" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <circle cx="22" cy="50" r="3.2" fill="#ffffff" stroke="#222222" stroke-width="2"/>
</svg>
